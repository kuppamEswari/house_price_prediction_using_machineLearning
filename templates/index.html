<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>House Price Prediction</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href="{{ url_for('static', filename='css/main.css') }}">
    <script src='main.js'></script>
</head>

<body>
    <div class="register_page">
        <div class="form">
            <form action="{{url_for('predict')}}" method="POST">
                Median income: <input type="number" name='MedInc' placeholder="Enter the median income" step="any"><br>
                HouseAge: <input type="number" name='HouseAge' placeholder="Enter house age" step="any"><br>
                Rooms: <input type="number" name='AveRooms' placeholder="Enter no of rooms" step="any"><br>
                Bedrms: <input type="number" name='AveBedrms' placeholder="Enter no of bedrooms" step="any"><br>
                Population: <input type="number" name='Population' placeholder="Enter the population" step="any"><br>
                occupation: <input type="number" name='AveOccup' placeholder="Enter average occupation" step="any"><br>
                Latitude: <input type="number" name='Latitude' placeholder="Enter the Latitude" step="any"><br>
                Longitude: <input type="number" name='Longitude' placeholder="Enter the Longitude" step="any"><br>
                <input type="submit" value="predict" class="submit">
            </form>
            <p> House Price is: {{data}}</p>
        </div>

    </div>


</body>

</html>
